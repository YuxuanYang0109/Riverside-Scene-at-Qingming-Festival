<!DOCTYPE html>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .scroll-container {
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      height: 100vh;
      white-space: nowrap;
      background: #000;
    }

    .scene {
      position: relative;
      flex-shrink: 0;
      height: 100vh;
    }

    .scene img.bg {
      height: 100vh;
      width: auto;
      display: block;
    }

    .layout-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      pointer-events: none; /* 避免挡住图片下方的滚动等交互 */
      cursor: pointer; /* 鼠标悬停时显示手型光标 */
    }

    .layout-box img.fg {
      position: absolute;
      height: 16vh;         /* 这里用vh单位，18可根据实际效果调整 */
      width: auto;
      transform-origin: center;
      transition: transform 0.3s ease;
      pointer-events: auto;
      animation: lively 4s ease-in-out infinite;
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.4)); /*  添加阴影 */
    }

    @keyframes lively {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      20% {
        transform: translateY(-5px) rotate(2deg);
      }
      40% {
        transform: translateY(2px) rotate(-1deg);
      }
      60% {
        transform: translateY(-1px) rotate(1deg);
      }
      80% {
        transform: translateY(1px) rotate(-0.5deg);
      }
    }

    .layout-box img.fg:hover {
      animation: none !important;
      transform: scale(1.13) !important; /* 1.13 ≈ 0.85/0.75，hover时略放大 */
    }

    .noise-symbol {
      position: absolute;
      font-size: 1vh;
      color: white;
      opacity: 0;
      animation: noise-burst 1.2s ease-out forwards;
      pointer-events: none;
      white-space: nowrap;
    }

    .noise-symbol.left {
      left: -2vw;
    }

    .noise-symbol.right {
      right: -2vw;
    }

    @keyframes noise-burst {
      0% {
        opacity: 0;
        transform: translateX(0) scale(1);
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateX(3vw) scale(1.3);
      }
    }

  <script>
    const container = document.getElementById('scrollContainer');
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      container.scrollLeft += e.deltaY;
    }, { passive: false });

     // 点击跳转功能
    document.querySelectorAll('.fg[data-link]').forEach(img => {
      img.addEventListener('click', () => {
        window.location.href = img.dataset.link;
      });
    });

    const chars = ["@#%", "!*$", "我爱大宋", "#!?","你好","嗯","吃了吗","再见","好的","不错","大宋","大宋好啊"];
    const fgList = document.querySelectorAll('.scene1 .fg');

    setInterval(() => {
    const fg = fgList[Math.floor(Math.random() * fgList.length)];
    const rect = fg.getBoundingClientRect(); // 获取图像在页面上的位置

    const span = document.createElement('span');
    span.classList.add('noise-symbol');
    span.innerText = chars[Math.floor(Math.random() * chars.length)];

    const side = Math.random() > 0.5 ? 'left' : 'right';
    span.classList.add(side);

    // 直接加到页面上
    document.body.appendChild(span);

    // 设置具体位置（相对于页面）
    span.style.position = 'fixed';
    span.style.top = rect.top + window.scrollY + 'px';
    if (side === 'left') {
        span.style.left = (rect.left + window.scrollX - 30) + 'px';
    } else {
        span.style.left = (rect.right + window.scrollX + 5) + 'px';
    }

    setTimeout(() => {
        span.remove();
    }, 5300);
    }, 100);

  </script>
